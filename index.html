<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stocks Cert — Halal Stock Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    /* Light (default) */
    body { background-color: #f9fafb; color: #111827; }
    /* Dark mode via .dark class on <html> */
    html.dark body { background-color: #111827 !important; color: #f3f4f6 !important; }
    html.dark .card { background-color: #1f2937 !important; }
    html.dark .thead { background-color: #374151 !important; }
    html.dark .row:hover { background-color: #1e3a8a !important; }
    html:not(.dark) button:hover { background-color: #e5e7eb !important; }
    html.dark button:hover { background-color: #374151 !important; }
    html.dark input, html.dark select { background-color: #374151 !important; color: #f3f4f6 !important; border-color: #4b5563 !important; }
    html.dark .bordered { border-color: #374151 !important; }
    html.dark .muted { color: #b0b0b0 !important; }
    /* focus indicator (AAA) */
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
    html.dark button:focus-visible, html.dark input:focus-visible, html.dark select:focus-visible { outline-color: #60a5fa; }
    html.dark .modal { background-color: #1f2937 !important; }
    html.dark .modal-bg { background-color: #111827 !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="app" class="w-full px-2 sm:px-4 py-4">
    <header class="mb-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">Halal Stock Screener (stocks-cert)</h1>
        <p class="text-sm muted">
          US stocks · {{ total }} loaded
          <span v-if="lastUpdated"> · data updated {{ lastUpdated }}</span>
          <span v-if="cacheStatus" class="ml-2 text-xs">({{ cacheStatus }})</span>
        </p>
      </div>
      <button @click="toggleDark" class="px-3 py-1 border bordered rounded text-sm" :title="dark ? 'Switch to light mode' : 'Switch to dark mode'">
        {{ dark ? '☀' : '☾' }}
      </button>
    </header>

    <section class="card rounded shadow p-4 mb-4 bordered">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input v-model="search" placeholder="Search ticker or name…" class="border bordered rounded px-3 py-2 text-sm bg-white" />
        <div class="flex flex-wrap gap-2 items-center text-sm">
          <span class="muted">Sharia:</span>
          <label v-for="s in shariaOptions" :key="s" class="flex items-center gap-1">
            <input type="checkbox" :value="s" v-model="shariaFilter" /> {{ s }}
          </label>
        </div>
        <div class="flex flex-wrap gap-2 items-center text-sm">
          <span class="muted">Exch:</span>
          <label v-for="e in exchangeOptions" :key="e" class="flex items-center gap-1">
            <input type="checkbox" :value="e" v-model="exchangeFilter" /> {{ e }}
          </label>
        </div>
      </div>
      <div class="mt-3 flex items-center gap-3 text-sm">
        <button @click="resetFilters" class="px-3 py-1 border bordered rounded">Reset</button>
        <span class="muted">{{ filtered.length }} matching · page {{ page }} of {{ totalPages }}</span>
        <button @click="exportCsv" class="ml-auto px-3 py-1 bg-blue-800 text-white rounded hover:bg-blue-900">Export CSV</button>
      </div>
    </section>

    <div v-if="loading && !rows.length" class="muted p-4">Loading data…</div>
    <div v-if="error" class="text-red-800 p-4">{{ error }}</div>
    <template v-if="rows.length">
      <div class="flex gap-4 items-start">
        <div class="flex-1 min-w-0">
          <div class="card rounded shadow overflow-x-auto bordered">
            <table class="min-w-full text-sm">
              <thead class="thead sticky top-0">
                <tr>
                  <th v-for="col in columns" :key="col.key" class="p-2 border bordered text-left cursor-pointer select-none" @click="sortBy(col.key)">
                    {{ col.label }}
                    <span v-if="sortCol===col.key">{{ sortDir==='asc' ? '▲' : '▼' }}</span>
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="r in pageRows" :key="r.id||r.ticker" class="hover:bg-blue-50 cursor-pointer row" @click="openDetail(r)">
                  <td class="p-2 border bordered font-mono">{{ r.ticker }}</td>
                  <td class="p-2 border bordered">{{ r.name }}</td>
                  <td class="p-2 border bordered text-center">{{ r.exchange }}</td>
                  <td class="p-2 border bordered text-center">
                    <span class="px-2 py-0.5 rounded text-xs" :class="shariaClass(r.sharia_compliance)">{{ r.sharia_compliance }}</span>
                  </td>
                  <td class="p-2 border bordered text-center">
                    <span class="px-2 py-0.5 rounded text-xs" :class="ratingClass(r.musaffaHalalRating)">{{ r.musaffaHalalRating || '—' }}</span>
                  </td>
                  <td class="p-2 border bordered text-center">{{ fmt(r.musaffa_iri_score) }}</td>
                  <td class="p-2 border bordered text-right">{{ (r.usdMarketCap/1000).toFixed(1) }}</td>
                  <td class="p-2 border bordered text-right">{{ fmt(r.businessCompliantRatio) }}</td>
                  <td class="p-2 border bordered text-right">{{ fmt(r.doubtful_revenue_percent) }}</td>
                  <td class="p-2 border bordered text-right">{{ fmt(r.interestBearingDebtRatio) }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="flex items-center justify-center gap-2 mt-4">
            <button @click="page=1" :disabled="page===1" class="px-2 py-1 border bordered rounded disabled:opacity-40">«</button>
            <button @click="page--" :disabled="page===1" class="px-2 py-1 border bordered rounded disabled:opacity-40">Prev</button>
            <span class="text-sm">Page {{ page }} / {{ totalPages }}</span>
            <button @click="page++" :disabled="page===totalPages" class="px-2 py-1 border bordered rounded disabled:opacity-40">Next</button>
            <button @click="page=totalPages" :disabled="page===totalPages" class="px-2 py-1 border bordered rounded disabled:opacity-40">»</button>
          </div>
        </div>

        <aside v-if="detail" class="w-full md:w-96 shrink-0 card rounded shadow p-4 bordered sticky top-4 max-h-[85vh] overflow-y-auto">
          <div class="flex items-start justify-between mb-3">
            <div>
              <h2 class="text-lg font-bold">{{ detail.ticker }} — {{ detail.name }}</h2>
              <p class="text-xs muted">{{ detail.musaffaSector }} · {{ detail.musaffaIndustry }} · {{ detail.exchange }}</p>
            </div>
            <button @click="detail=null" class="text-gray-500 text-xl leading-none" title="Close">×</button>
          </div>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Sharia</div><div class="font-semibold">{{ detail.sharia_compliance }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Halal Rating</div><div class="font-semibold">{{ detail.musaffaHalalRating || '—' }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">IRI Score</div><div class="font-semibold">{{ fmt(detail.musaffa_iri_score) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Market Cap $B</div><div class="font-semibold">{{ (detail.usdMarketCap/1000).toFixed(1) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Biz Compliant %</div><div class="font-semibold">{{ fmt(detail.businessCompliantRatio) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Non-Compliant %</div><div class="font-semibold">{{ fmt(detail.businessNonCompliantRatio) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Questionable %</div><div class="font-semibold">{{ fmt(detail.businessQuestionableRatio) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Doubtful %</div><div class="font-semibold">{{ fmt(detail.doubtful_revenue_percent) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Halal Revenue %</div><div class="font-semibold">{{ fmt(detail.halal_revenue_percent) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">Debt %</div><div class="font-semibold">{{ fmt(detail.interestBearingDebtRatio) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">ROE</div><div class="font-semibold">{{ fmt(detail.ROE) }}</div></div>
            <div class="modal-bg rounded p-2"><div class="muted text-xs">P/E (TTM)</div><div class="font-semibold">{{ fmt(detail.peTTM) }}</div></div>
          </div>
          <div class="mt-3 text-xs muted">Data from musaffa Typesense · not investment advice.</div>
        </aside>
      </div>
    </template>

  <script>
    const { createApp, ref, computed, onMounted, watch } = Vue;
    const RATING_ORDER = { COMPLIANT: 0, QUESTIONABLE: 1, NON_COMPLIANT: 2 };
    const DATE_KEY = 'stocks-cert:fetchDate';
    const COLUMNS = [
      { key: 'ticker', label: 'Ticker' },
      { key: 'name', label: 'Name' },
      { key: 'exchange', label: 'Exch' },
      { key: 'sharia_compliance', label: 'Sharia' },
      { key: 'musaffaHalalRating', label: 'Halal Rating' },
      { key: 'musaffa_iri_score', label: 'IRI' },
      { key: 'usdMarketCap', label: 'MktCap $B' },
      { key: 'businessCompliantRatio', label: 'Biz %' },
      { key: 'doubtful_revenue_percent', label: 'Doubt %' },
      { key: 'interestBearingDebtRatio', label: 'Debt %' },
    ];

    const getVal = (r, key) => {
      if (key === 'usdMarketCap') return (r.usdMarketCap || 0) / 1000;
      return r[key];
    };

    // badge colors (Tailwind classes, light-mode only; dark handled by CSS above is minimal,
    // but badges keep their color in both modes)
    const shariaBadge = (v) => ({
      'COMPLIANT': 'bg-green-100 text-green-900',
      'QUESTIONABLE': 'bg-yellow-100 text-yellow-900',
      'NON_COMPLIANT': 'bg-red-100 text-red-900',
    }[v] || 'bg-gray-100 text-gray-700');
    const ratingBadge = shariaBadge;

    createApp({
      setup() {
        const rows = ref([]);
        const loading = ref(true);
        const error = ref(null);
        const search = ref('');
        const shariaFilter = ref(['COMPLIANT','NON_COMPLIANT','QUESTIONABLE']);
        const exchangeFilter = ref(['NYSE','NASDAQ','XASE','BATS','ARCX']);
        const shariaOptions = ['COMPLIANT','NON_COMPLIANT','QUESTIONABLE'];
        const exchangeOptions = ['NYSE','NASDAQ','XASE','BATS','ARCX'];
        const page = ref(1);
        const pageSize = 50;
        const detail = ref(null);
        const lastUpdated = ref(null);
        const cacheStatus = ref('');
        const dark = ref(localStorage.getItem('stocks-cert:dark') !== '0');
        const sortCol = ref('usdMarketCap');
        const sortDir = ref('desc');

        const columns = COLUMNS;

        const applyDark = () => {
          document.documentElement.classList.toggle('dark', dark.value);
          document.body.style.backgroundColor = dark.value ? '#111827' : '#f9fafb';
          document.body.style.color = dark.value ? '#f3f4f6' : '#111827';
        };
        applyDark();
        const toggleDark = () => {
          dark.value = !dark.value;
          localStorage.setItem('stocks-cert:dark', dark.value ? '1' : '0');
          applyDark();
        };

        const fmt = (v) => (v == null ? '—' : (typeof v === 'number' ? v.toFixed(2) : v));
        const shariaClass = (v) => shariaBadge(v);
        const ratingClass = (v) => ratingBadge(v);

        const setRows = (data) => {
          rows.value = (data.hits || []).map(h => h.document || h);
          lastUpdated.value = data.fetched_at || null;
        };

        const loadCache = async () => {
          try {
            if (!('caches' in window)) return false;
            const cache = await caches.open('stocks-cert');
            const resp = await cache.match('data/stocks.json');
            if (resp) {
              const data = await resp.json();
              setRows(data);
              cacheStatus.value = 'cached';
              return true;
            }
          } catch (e) { /* ignore */ }
          return false;
        };

        const today = () => new Date().toISOString().slice(0,10);

        const backgroundFetch = async () => {
          const last = localStorage.getItem(DATE_KEY);
          if (last === today()) {
            cacheStatus.value = cacheStatus.value || 'up to date';
            return;
          }
          try {
            const res = await fetch('data/stocks.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const clone = res.clone();
            const data = await res.json();
            setRows(data);
            cacheStatus.value = 'updated';
            localStorage.setItem(DATE_KEY, today());
            if ('caches' in window) {
              const cache = await caches.open('stocks-cert');
              await cache.put('data/stocks.json', clone);
            }
          } catch (e) {
            if (!rows.value.length) error.value = e.message;
            cacheStatus.value = rows.value.length ? 'fetch failed (cached)' : 'fetch failed';
          }
        };

        onMounted(async () => {
          await loadCache();
          loading.value = false;
          backgroundFetch();
        });

        const filtered = computed(() => {
          const q = search.value.trim().toLowerCase();
          return rows.value.filter(r => {
            if (!shariaFilter.value.includes(r.sharia_compliance)) return false;
            if (!exchangeFilter.value.includes(r.exchange)) return false;
            if (q) {
              const hay = (r.ticker + ' ' + (r.name||'')).toLowerCase();
              if (!hay.includes(q)) return false;
            }
            return true;
          });
        });

        const cmp = (a, b) => {
          const an = a == null, bn = b == null;
          if (an && bn) return 0;
          if (an) return 1;
          if (bn) return -1;
          if (typeof a === 'number' && typeof b === 'number') return a - b;
          return String(a).localeCompare(String(b));
        };

        const sorted = computed(() => {
          const arr = [...filtered.value];
          const key = sortCol.value;
          const dir = sortDir.value === 'asc' ? 1 : -1;
          arr.sort((a, b) => {
            const va = getVal(a, key);
            const vb = getVal(b, key);
            if (key === 'musaffaHalalRating') {
              const ra = RATING_ORDER[va] ?? 3;
              const rb = RATING_ORDER[vb] ?? 3;
              return dir * (ra - rb);
            }
            return dir * cmp(va, vb);
          });
          return arr;
        });

        const sortBy = (key) => {
          if (sortCol.value === key) {
            sortDir.value = sortDir.value === 'asc' ? 'desc' : 'asc';
          } else {
            sortCol.value = key;
            const numeric = ['musaffa_iri_score','usdMarketCap','businessCompliantRatio','doubtful_revenue_percent','interestBearingDebtRatio'].includes(key);
            sortDir.value = numeric ? 'desc' : 'asc';
          }
          page.value = 1;
        };

        const totalPages = computed(() => Math.max(1, Math.ceil(sorted.value.length / pageSize)));
        const pageRows = computed(() => {
          const p = Math.min(page.value, totalPages.value);
          const start = (p-1)*pageSize;
          return sorted.value.slice(start, start+pageSize);
        });

        watch([search, shariaFilter, exchangeFilter], () => { page.value = 1; });

        const resetFilters = () => {
          search.value = '';
          shariaFilter.value = [...shariaOptions];
          exchangeFilter.value = [...exchangeOptions];
          sortCol.value = 'usdMarketCap';
          sortDir.value = 'desc';
          page.value = 1;
        };
        const openDetail = (r) => {
          if (detail.value && (detail.value.id || detail.value.ticker) === (r.id || r.ticker)) {
            detail.value = null;
          } else {
            detail.value = r;
          }
        };
        const exportCsv = () => {
          const cols = ['ticker','name','exchange','sharia_compliance','musaffaHalalRating','musaffa_iri_score','usdMarketCap','businessCompliantRatio','doubtful_revenue_percent','interestBearingDebtRatio'];
          const lines = [cols.join(',')];
          for (const r of sorted.value) {
            lines.push(cols.map(c => {
              const v = r[c];
              const s = v == null ? '' : String(v);
              return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
            }).join(','));
          }
          const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'stocks_filtered.csv'; a.click();
          URL.revokeObjectURL(url);
        };

        const total = computed(() => rows.value.length);
        return { rows, loading, error, search, shariaFilter, exchangeFilter,
                 shariaOptions, exchangeOptions, page, pageSize, totalPages, pageRows,
                 filtered, sorted, total, detail, lastUpdated, cacheStatus, dark,
                 sortCol, sortDir, columns, fmt, shariaClass, ratingClass,
                 resetFilters, openDetail, exportCsv, toggleDark, sortBy };
      }
    }).mount('#app');
  </script>
</body>
</html>
